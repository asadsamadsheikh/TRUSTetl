<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrustETL | Upload Dataset</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="ai-background">

    <div class="bg-grid"></div>

    <div class="bg-orb orb-one"></div>
    <div class="bg-orb orb-two"></div>

    <div class="data-particle particle-1"></div>
    <div class="data-particle particle-2"></div>
    <div class="data-particle particle-3"></div>
    <div class="data-particle particle-4"></div>
    <div class="data-particle particle-5"></div>
    <div class="data-particle particle-6"></div>
    <div class="data-particle particle-7"></div>
    <div class="data-particle particle-8"></div>

</div>

    <!-- =========================
         NAVBAR
    ========================== -->
    <nav class="navbar">

        <!-- TrustETL Logo -->
        <a class="brand" href="index.html">

            <div class="brand-logo">
                <span>TE</span>
            </div>

            <span class="brand-name">
                Trust<span>ETL</span>
            </span>

        </a>


        <!-- Navigation Links -->
        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>


            <!-- =========================
                 PROFILE
            ========================== -->
            <div class="profile-container">

                <button
                    class="profile-button"
                    id="profileButton"
                    aria-label="Open profile"
                    type="button"
                >
                    M
                </button>


                <!-- Profile Dropdown -->
                <div
                    class="profile-menu"
                    id="profileMenu"
                >

                    <!-- Profile Header -->
                    <div class="profile-header">

                        <div
                            class="profile-large"
                            id="profileLarge"
                        >
                            M
                        </div>


                        <div class="profile-details">

                            <h3 id="profileName">
                                Manav
                            </h3>

                            <p id="profileEmail">
                                user@trustetl.com
                            </p>

                        </div>

                    </div>


                    <div class="menu-divider"></div>


                    <!-- Change Profile -->
                    <button
                        class="profile-item"
                        id="changeProfile"
                        type="button"
                    >
                        <span class="item-icon">👤</span>
                        <span>Change profile</span>
                    </button>


                    <!-- Account Settings -->
                    <button
                        class="profile-item"
                        id="accountSettings"
                        type="button"
                    >
                        <span class="item-icon">⚙</span>
                        <span>Account settings</span>
                    </button>


                    <!-- Help & Support -->
                    <button
                        class="profile-item"
                        id="helpSupport"
                        type="button"
                    >
                        <span class="item-icon">?</span>
                        <span>Help &amp; support</span>
                    </button>


                    <div class="menu-divider"></div>


                    <!-- Logout -->
                    <button
                        class="profile-item logout"
                        id="logoutButton"
                        type="button"
                    >
                        <span class="item-icon">↪</span>
                        <span>Logout</span>
                    </button>

                </div>


                <!-- Profile Image Input -->
                <input
                    type="file"
                    id="profileImageInput"
                    accept="image/png,image/jpeg,image/jpg,image/webp"
                    hidden
                >

            </div>

        </nav>

    </nav>



    <!-- =========================
         UPLOAD PAGE
    ========================== -->
    <main class="container narrow">


        <!-- Page Hero -->
        <section class="page-hero">

            <p class="eyebrow">
                STEP 01
            </p>

            <h1>
                Upload Dataset
            </h1>

            <p>
                Choose a CSV, Excel, or JSON file to begin the
                TrustETL pipeline.
            </p>

        </section>



        <!-- =========================
             UPLOAD CARD
        ========================== -->
        <section class="card upload-card">


            <!-- Drop Zone -->
            <div
                id="dropZone"
                class="drop-zone"
            >

                <div class="upload-icon">
                    ↑
                </div>

                <h2>
                    Drag &amp; drop your dataset
                </h2>

                <p>
                    or choose a file from your computer
                </p>


                <!-- Choose File -->
                <label
                    class="button primary"
                    for="fileInput"
                >
                    Choose File
                </label>


                <input
                    id="fileInput"
                    type="file"
                    accept=".csv,.xlsx,.xls,.json"
                    hidden
                >


                <p class="file-help">
                    CSV, XLSX, XLS, JSON · Maximum 50 MB
                </p>

            </div>



            <!-- =========================
                 SELECTED FILE
            ========================== -->
            <div
                id="fileDetails"
                class="selected-file hidden"
            >

                <div>

                    <strong id="fileName">
                        No file selected
                    </strong>

                    <small id="fileSize"></small>

                </div>


                <button
                    id="removeFile"
                    class="button secondary"
                    type="button"
                >
                    Remove
                </button>

            </div>



            <!-- =========================
                 ACTION BUTTONS
            ========================== -->
            <div class="button-row">

                <a
                    href="dashboard.html"
                    class="button secondary"
                >
                    Cancel
                </a>


                <a
                    id="continueButton"
                    href="profiling.html"
                    class="button primary disabled"
                >
                    Continue to Profiling →
                </a>

            </div>

        </section>

    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->
    <script src="js/script.js"></script>

</body>

</html>
